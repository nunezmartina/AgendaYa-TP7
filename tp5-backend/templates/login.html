{% extends "base.html" %}{% block titulo %}Ingresar{% endblock %}
{% block contenido %}
<div class="card" style="max-width:420px">
<h1>Ingreso del administrador</h1>
{% if error %}<div class="flash error">{{ error }}</div>{% endif %}
<form method="post">
<label for="email">Email</label><input type="email" id="email" name="email" value="admin@agendaya.com">
<label for="password">Contraseña</label><input type="password" id="password" name="password">
<p><button class="btn" type="submit">Ingresar</button></p>
</form></div>
{% endblock %}
