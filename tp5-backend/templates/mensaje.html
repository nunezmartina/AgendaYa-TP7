{% extends "base.html" %}{% block titulo %}{{ m.asunto }}{% endblock %}
{% block contenido %}
<div class="mail"><div class="cab"><strong>{{ m.asunto }}</strong><br>
<span class="muted">Para: {{ m.destinatario }} · {{ m.enviada_en|fh }} · Plantilla: {{ m.plantilla_nombre or '—' }}</span></div>
<div class="cuerpo">{{ m.cuerpo_html|safe }}</div></div>
<p><a href="{{ url_for('buzon', email=m.destinatario) }}">← Volver a la bandeja</a></p>
{% endblock %}
