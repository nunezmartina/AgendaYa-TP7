# =============================================================================
# AgendaYA · Módulo M06 · Pipeline de integración y despliegue continuo
# TP N°7 "Plan de desarrollo y mantenimiento" — Grupo 9
#
# Cubre todas las ramas por las que pasa el hotfix según el plan: develop, main y hotfix/**.
#   - backend-python    : TP5 (Flask) → formato, linter, build y tests (pytest)
#   - frontend-js       : TP6 (JS)    → formato, linter, build y tests unitarios (Jest)
#   - e2e-cypress       : TP6         → tests E2E de Cypress como pruebas de integración
#   - deploy-staging    : PR hacia main  → Firebase Hosting (canal de preview del PR, para QA)
#   - deploy-desarrollo : merge a develop → Firebase Hosting (canal "desarrollo")
#   - deploy-produccion : merge a main    → Firebase Hosting (live), con aprobación manual
# =============================================================================
name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop, 'hotfix/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Solo se cancelan ejecuciones viejas en PRs: un push nuevo no debe cancelar
  # un despliegue a producción que está esperando aprobación.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  backend-python:
    name: Backend (Python) · formato, linter, build y tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tp5-backend
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tp5-backend/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: 1. Formato (ruff format --check)
        run: ruff format --check --diff .

      - name: 2. Linter (ruff check)
        run: ruff check --output-format=github .

      - name: 3. Build (compilación y arranque de la app)
        run: |
          python -m compileall -q app.py escenarios.py tests
          python -c "import app; print('Build OK: la app Flask importa y registra', len(list(app.app.url_map.iter_rules())), 'rutas')"

      - name: 4. Tests automatizados (pytest · CP-001 a CP-016)
        run: python -m pytest -v

  # ---------------------------------------------------------------------------
  frontend-js:
    name: Frontend (JS) · formato, linter, build y tests unitarios
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tp6-frontend
    env:
      CYPRESS_INSTALL_BINARY: 0 # este job no corre Cypress: se evita descargar el binario
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tp6-frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: 1. Formato (prettier --check)
        run: npm run format:check

      - name: 2. Linter (eslint)
        run: npm run lint

      - name: 3. Build (validar y empaquetar en dist/)
        run: npm run build

      - name: 4. Tests unitarios (Jest)
        run: npm test -- --ci

      - name: Guardar el build como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: tp6-frontend/dist
          retention-days: 7

  # ---------------------------------------------------------------------------
  e2e-cypress:
    name: Tests E2E (Cypress)
    runs-on: ubuntu-latest
    needs: frontend-js
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 5. Tests E2E de integración (Cypress)
        uses: cypress-io/github-action@v6
        with:
          working-directory: tp6-frontend
          build: npm run build
          start: npm start
          wait-on: 'http://localhost:5500'
          wait-on-timeout: 60
          browser: electron

      - name: Guardar capturas si un test E2E falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: tp6-frontend/cypress/screenshots
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Despliegues (nivel avanzado). Solo corren si los 3 jobs anteriores pasaron
  # y si se configuró la variable FIREBASE_PROJECT_ID en el repositorio.
  # ---------------------------------------------------------------------------
  deploy-staging:
    name: Deploy a Staging (preview del PR en Firebase Hosting)
    runs-on: ubuntu-latest
    needs: [backend-python, frontend-js, e2e-cypress]
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && vars.FIREBASE_PROJECT_ID != ''
    permissions:
      contents: read
      pull-requests: write # para comentar en el PR la URL del preview
      checks: write
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Descargar el build validado
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: tp6-frontend/dist

      - name: Publicar en un canal de preview del PR
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          entryPoint: tp6-frontend
          expires: 7d

  deploy-desarrollo:
    name: Deploy a Desarrollo (Firebase Hosting)
    runs-on: ubuntu-latest
    needs: [backend-python, frontend-js, e2e-cypress]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.FIREBASE_PROJECT_ID != ''
    environment:
      name: desarrollo
      url: ${{ steps.deploy.outputs.details_url }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Descargar el build validado
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: tp6-frontend/dist

      - name: Publicar en el canal "desarrollo"
        id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          entryPoint: tp6-frontend
          channelId: desarrollo
          expires: 30d

  deploy-produccion:
    name: Deploy a Producción (Firebase Hosting · requiere aprobación)
    runs-on: ubuntu-latest
    needs: [backend-python, frontend-js, e2e-cypress]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.FIREBASE_PROJECT_ID != ''
    environment:
      # Environment con "Required reviewers" (Tech Lead / Product Owner): el job queda
      # en espera hasta que uno de ellos aprueba (plan: "Despliegue y aprobación").
      name: production
      url: ${{ steps.deploy.outputs.details_url }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Descargar el build validado
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: tp6-frontend/dist

      - name: Publicar en producción (canal live)
        id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          entryPoint: tp6-frontend
          channelId: live
